<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBTI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='none' stroke-width='5' stroke-linecap='round' transform='rotate(-90 20 20)'%3E%3Ccircle cx='20' cy='20' r='15' pathLength='100' stroke-dasharray='17 83' stroke='%23FF6F86'/%3E%3Ccircle cx='20' cy='20' r='15' pathLength='100' stroke-dasharray='17 83' stroke-dashoffset='-25' stroke='%2323BFAE'/%3E%3Ccircle cx='20' cy='20' r='15' pathLength='100' stroke-dasharray='17 83' stroke-dashoffset='-50' stroke='%23F5B63F'/%3E%3Ccircle cx='20' cy='20' r='15' pathLength='100' stroke-dasharray='17 83' stroke-dashoffset='-75' stroke='%238B7BFF'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Noto+Kufi+Arabic:wght@600;800&family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  color-scheme:light;
  --bg:#EFEBFF; --ink:#1E1B4B; --muted:#55527F;
  --tile:#FFFFFF; --line:rgba(30,27,75,.12);
  --c1:#E5456B; --c2:#0E9F93; --c3:#B9780A; --c4:#5B4AE6;
  --accent:#5B4AE6; --on-accent:#FFFFFF;
  --g1:rgba(155,140,255,.45); --g2:rgba(63,208,192,.30); --g3:rgba(255,122,138,.26);
  --shadow:0 18px 40px -18px rgba(60,40,160,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15133A; --ink:#F3F0FF; --muted:#B4B0DC;
    --tile:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
    --c1:#FF8A9B; --c2:#4FDCCB; --c3:#FFCB6B; --c4:#A99BFF;
    --accent:#A99BFF; --on-accent:#15133A;
    --g1:rgba(120,100,255,.45); --g2:rgba(40,190,180,.22); --g3:rgba(255,100,130,.20);
    --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15133A; --ink:#F3F0FF; --muted:#B4B0DC;
  --tile:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --c1:#FF8A9B; --c2:#4FDCCB; --c3:#FFCB6B; --c4:#A99BFF;
  --accent:#A99BFF; --on-accent:#15133A;
  --g1:rgba(120,100,255,.45); --g2:rgba(40,190,180,.22); --g3:rgba(255,100,130,.20);
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:
    radial-gradient(60% 45% at 88% 6%,var(--g1),transparent 70%),
    radial-gradient(55% 42% at 6% 94%,var(--g3),transparent 70%),
    radial-gradient(45% 35% at 96% 88%,var(--g2),transparent 70%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Vazirmatn","Noto Kufi Arabic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:22px 24px 32px}
.brand{display:flex;align-items:center;gap:10px;direction:ltr;align-self:flex-start}
.brand svg{width:30px;height:30px;display:block}
.brand b{font:800 1.15rem/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.04em}
main{flex:1;display:flex;align-items:center;justify-content:center}
.view{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:34rem}
.view[hidden]{display:none}

.dial{display:flex;gap:clamp(8px,2.4vw,18px);direction:ltr;font-size:clamp(3.4rem,17vw,8rem)}
.slot{
  position:relative;width:.78em;height:1.14em;border-radius:.2em;overflow:hidden;
  background:var(--tile);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font:800 1em/1 "Bricolage Grotesque",system-ui,sans-serif;
}
.slot:nth-child(1){color:var(--c1)}
.slot:nth-child(2){color:var(--c2)}
.slot:nth-child(3){color:var(--c3)}
.slot:nth-child(4){color:var(--c4)}
.slot span{
  position:absolute;inset:0;display:grid;place-items:center;
  transition:transform .55s cubic-bezier(.65,0,.2,1);
}
.slot .in{transform:translateY(100%)}
.slot .out{transform:translateY(-100%)}
.slot .on{transform:none}
.slot.spin span{filter:blur(1.5px);opacity:.75}

h1{
  margin:clamp(1.6rem,5vw,2.4rem) 0 0;
  font:800 clamp(2.1rem,8vw,3.5rem)/1.25 "Noto Kufi Arabic","Vazirmatn",sans-serif;
}
.lead{
  margin:.9rem 0 0;max-width:30rem;
  font:400 clamp(1rem,2.8vw,1.18rem)/1.95 "Vazirmatn","Noto Kufi Arabic",sans-serif;
  color:var(--muted);
}
.btn{
  margin-top:clamp(1.6rem,5vw,2.2rem);
  display:inline-flex;align-items:center;gap:.7em;
  padding:.95em 1.7em;border:0;border-radius:999px;cursor:pointer;
  background:var(--accent);color:var(--on-accent);
  font:800 1.05rem/1 "Noto Kufi Arabic","Vazirmatn",sans-serif;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn svg{width:20px;height:20px;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn:hover svg{transform:translateX(-4px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line)}

.js .reveal{opacity:0;transform:translateY(14px);transition:opacity .8s ease var(--d,0s),transform .8s ease var(--d,0s)}
.js .ready .reveal{opacity:1;transform:none}
.fadein{animation:fadein .6s ease both}
.view.next{max-width:28rem}
.next h1{margin-top:1.1rem;font-size:clamp(1.7rem,6.5vw,2.4rem)}
.hero{position:relative;width:112px;height:112px;margin-top:4px}
.hero svg{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 16px 18px rgba(91,74,230,.35))}
.orb{position:absolute;border-radius:50%;filter:blur(.5px);animation:float 5s ease-in-out infinite}
.o1{width:22px;height:22px;background:var(--c1);top:-6px;left:-14px}
.o2{width:14px;height:14px;background:var(--c2);bottom:6px;right:-18px;animation-delay:-1.6s}
.o3{width:10px;height:10px;background:var(--c3);bottom:-6px;left:6px;animation-delay:-3.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.auth{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;margin-top:2rem}
.opt{
  --cc:var(--c4);
  position:relative;display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 16px;border-radius:24px;cursor:pointer;text-align:start;
  background:var(--tile);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-family:inherit;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}
.opt.signup{--cc:var(--c2)}
.opt:hover{transform:translateY(-3px);border-color:var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--tile))}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opt .badge{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent);border:1px solid color-mix(in srgb,var(--cc) 35%,transparent)}
.opt .badge svg{width:30px;height:30px;display:block}
.opt .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt b{font:800 1.15rem/1.5 "Noto Kufi Arabic","Vazirmatn",sans-serif}
.opt small{font:400 .9rem/1.7 "Vazirmatn","Noto Kufi Arabic",sans-serif;color:var(--muted)}
.opt .go{flex:none;width:34px;height:34px;padding:8px;border-radius:50%;background:var(--cc);color:var(--bg);transition:transform .2s ease}
.opt:hover .go{transform:translateX(-4px)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font:500 .9rem/1 "Vazirmatn",sans-serif;margin:6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.perks{list-style:none;margin:1.5rem 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;color:var(--muted);font:500 .88rem/1.4 "Vazirmatn",sans-serif}
.perks li{display:flex;align-items:center;gap:6px}
.perks svg{width:16px;height:16px;padding:2px;border-radius:50%;background:color-mix(in srgb,var(--c2) 22%,transparent);color:var(--c2)}
.link{margin-top:1.2rem;padding:.6em 1em;border:0;background:none;cursor:pointer;color:var(--muted);font:500 .98rem/1.4 "Vazirmatn","Noto Kufi Arabic",sans-serif;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--ink)}
.link:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.orb{animation:none}.opt,.opt .go{transition:none}}
.view.form,.view.account{max-width:26rem}
.form h1,.account h1{margin-top:0;font-size:clamp(1.9rem,7vw,2.8rem)}
.account h1{margin-top:1.2rem;word-break:break-word}
.fields{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:1.6rem;text-align:start}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font:500 .95rem/1.4 "Vazirmatn",sans-serif;color:var(--muted)}
.field small{font:400 .82rem/1.4 "Vazirmatn",sans-serif;color:var(--muted)}
.field input{width:100%;padding:.95em 1.1em;border-radius:16px;border:2px solid var(--line);background:var(--tile);color:var(--ink);font:500 1rem/1.4 "Vazirmatn",system-ui,sans-serif;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s ease}
.field input[dir=ltr]{text-align:left}
.field input:focus{outline:none;border-color:var(--accent)}
.field input[aria-invalid=true]{border-color:var(--c1)}
.msg{margin:0;min-height:1.4em;font:500 .92rem/1.6 "Vazirmatn",sans-serif;color:var(--c1);text-align:center}
.msg.ok{color:var(--c2)}
.fields .btn{margin-top:.2rem;width:100%;justify-content:center}
.btn:disabled{opacity:.55;cursor:wait}
.view.verify{max-width:26rem}
.verify h1{margin-top:1.2rem;font-size:clamp(1.7rem,6.5vw,2.4rem)}
.verify .lead{word-break:break-word}
.verify .lead bdi{color:var(--ink);font-weight:500}
.code{width:100%;text-align:center!important;letter-spacing:.5em;padding-inline-start:calc(1.1em + .5em)!important;font:800 1.6rem/1.4 "Bricolage Grotesque",system-ui,sans-serif!important}
.link:disabled{opacity:.55;cursor:default;text-decoration:none}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .slot span,.btn,.btn svg,.js .reveal{transition:none}
  .fadein{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g fill="none" stroke-width="5" stroke-linecap="round" transform="rotate(-90 20 20)">
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke="var(--c1)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-25" stroke="var(--c2)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-50" stroke="var(--c3)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-75" stroke="var(--c4)"/>
      </g>
    </svg>
    <b>MBTI</b>
  </header>

  <main>
    <section class="view welcome" id="welcome">
      <div class="dial" id="dial" aria-hidden="true"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      <h1 class="reveal" style="--d:0s">بەخێربێیت</h1>
      <p class="lead reveal" style="--d:.15s">با کەسایەتی خۆت بناسین. چەند هەنگاوێکی کورت، وێنەیەکی ڕوونتر لە شێوازی بیرکردنەوە و هەستکردن و بڕیاردانی تۆ.</p>
      <button class="btn reveal" id="start" type="button" style="--d:.3s">
        دەست پێبکە
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      </button>
    </section>

    <section class="view next fadein" id="next" hidden>
      <div class="hero" aria-hidden="true">
        <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
        <svg viewBox="0 0 120 120"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#5B4AE6"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="url(#hg)"/><circle cx="60" cy="60" r="54" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><circle cx="60" cy="46" r="15" fill="#fff"/><path d="M30 94c0-17 13-26 30-26s30 9 30 26c-8 7-18 11-30 11S38 101 30 94z" fill="#fff"/><path d="M92 24l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z" fill="#FFE08A"/><path d="M24 34l1.2 3.2 3.2 1.2-3.2 1.2L24 43l-1.2-3.4-3.2-1.2 3.2-1.2z" fill="#fff" opacity=".85"/></svg>
      </div>

      <div class="auth">
        <button class="opt login" id="login" type="button">
          <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M16 7l3 3"/><path d="M14 9l2 2"/></svg></span>
          <span class="txt"><b>چوونە ژوورەوە</b><small>هەژمارت هەیە؟ بەردەوام بە لەو شوێنەی بەجێت هێشتبوو.</small></span>
          <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </button>

        <div class="or"><span>یان</span></div>

        <button class="opt signup" id="signup" type="button">
          <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M19 8v6M16 11h6"/></svg></span>
          <span class="txt"><b>خۆتۆمارکردن</b><small>نوێیت؟ هەژمارێک دروست بکە، تەنها چەند چرکەیەک دەخایەنێت.</small></span>
          <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <button class="link" id="back" type="button">گەڕانەوە</button>
    </section>

    <section class="view form" id="loginView" hidden>
      <h1>چوونە ژوورەوە</h1>
      <form class="fields" id="loginForm" novalidate>
        <label class="field"><span>ئیمەیڵ</span><input type="email" name="email" dir="ltr" autocomplete="email" inputmode="email" required></label>
        <label class="field"><span>وشەی نهێنی</span><input type="password" name="password" dir="ltr" autocomplete="current-password" required></label>
        <p class="msg" id="loginMsg" role="alert" aria-live="polite"></p>
        <button class="btn" type="submit">چوونە ژوورەوە</button>
      </form>
      <button class="link" type="button" data-go="next">گەڕانەوە</button>
    </section>

    <section class="view form" id="signupView" hidden>
      <h1>خۆتۆمارکردن</h1>
      <form class="fields" id="signupForm" novalidate>
        <label class="field"><span>ناو</span><input type="text" name="name" autocomplete="name" maxlength="60" required></label>
        <label class="field"><span>ئیمەیڵ</span><input type="email" name="email" dir="ltr" autocomplete="email" inputmode="email" required></label>
        <label class="field"><span>وشەی نهێنی</span><input type="password" name="password" dir="ltr" autocomplete="new-password" minlength="8" required><small>لانیکەم ٨ پیت</small></label>
        <p class="msg" id="signupMsg" role="alert" aria-live="polite"></p>
        <button class="btn" type="submit">خۆتۆمارکردن</button>
      </form>
      <button class="link" type="button" data-go="next">گەڕانەوە</button>
    </section>

    <section class="view verify" id="verifyView" hidden>
      <div class="hero" aria-hidden="true"><svg viewBox="0 0 120 120"><defs><linearGradient id="hg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#5B4AE6"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="url(#hg3)"/><circle cx="60" cy="60" r="54" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><rect x="30" y="40" width="60" height="42" rx="8" fill="#fff"/><path d="M34 46l26 20 26-20" fill="none" stroke="#5B4AE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>پشتڕاستکردنەوەی ئیمەیڵ</h1>
      <p class="lead">کۆدێکمان نارد بۆ <bdi dir="ltr" id="verifyEmail"></bdi>. کۆدەکە لێرە بنووسە.</p>
      <form class="fields" id="verifyForm" novalidate>
        <label class="field"><span>کۆدی پشتڕاستکردنەوە</span><input class="code" type="text" name="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></label>
        <p class="msg" id="verifyMsg" role="alert" aria-live="polite"></p>
        <button class="btn" type="submit">پشتڕاستکردنەوە</button>
      </form>
      <button class="link" type="button" id="resend">ناردنەوەی کۆد</button>
      <button class="link" type="button" id="verifyBack" style="margin-top:0">گەڕانەوە</button>
    </section>

    <section class="view account" id="accountView" hidden>
      <div class="hero" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="url(#hg2)"/><defs><linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FDCCB"/><stop offset="1" stop-color="#0E9F93"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M36 62l16 16 32-34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 id="hello">سڵاو</h1>
      <p class="lead" id="who"></p>
      <button class="btn ghost" id="logout" type="button">چوونە دەرەوە</button>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var pairs=["EI","SN","TF","JP"];
  var types=["INFJ","ENTP","ISFP","ESTJ","INTP","ENFJ","ISTJ","ENFP","INTJ","ESFP","ISFJ","ENTJ","INFP","ESTP","ISTP","ESFJ"];
  var slots=[].slice.call(document.querySelectorAll('.slot'));
  var welcome=document.getElementById('welcome'),next=document.getElementById('next');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  slots.forEach(function(s,i){
    s.innerHTML='<span class="on"></span>';
    s.firstChild.textContent=pairs[i].charAt(Math.random()<.5?0:1);
  });

  function flip(slot,ch){
    var cur=slot.querySelector('.on');
    if(!cur||cur.textContent===ch)return;
    var nx=document.createElement('span');
    nx.textContent=ch;nx.className='in';
    slot.appendChild(nx);
    nx.getBoundingClientRect();
    cur.className='out';nx.className='on';
    setTimeout(function(){cur.remove()},650);
  }

  function reveal(){
    welcome.classList.add('ready');
    if(reduce)return;
    var k=0;
    setInterval(function(){
      k=(k+1)%types.length;
      slots.forEach(function(s,i){setTimeout(function(){flip(s,types[k].charAt(i))},i*160)});
    },3600);
  }

  if(reduce){
    slots.forEach(function(s,i){s.firstChild.textContent=types[0].charAt(i)});
    reveal();
  }else{
    var done=0;
    slots.forEach(function(s,i){
      var first=s.firstChild;
      s.classList.add('spin');
      var t=setInterval(function(){first.textContent=pairs[i].charAt(Math.random()<.5?0:1)},75);
      setTimeout(function(){
        clearInterval(t);s.classList.remove('spin');
        flip(s,types[0].charAt(i));
        if(++done===4)setTimeout(reveal,300);
      },700+i*260);
    });
  }

  var SUPABASE_URL='https://rmalzfubkyrwubgoiwsq.supabase.co';
  var SUPABASE_KEY='sb_publishable_wTg5mh7u3nZ-dih6qtMuHQ_YIjB0WAw';
  var db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

  var loginView=document.getElementById('loginView'),signupView=document.getElementById('signupView'),accountView=document.getElementById('accountView');
  var verifyView=document.getElementById('verifyView');
  var views=[welcome,next,loginView,signupView,verifyView,accountView];
  function show(v){
    views.forEach(function(x){x.hidden=(x!==v)});
    v.classList.remove('fadein');v.getBoundingClientRect();v.classList.add('fadein');
    window.scrollTo(0,0);
  }
  document.getElementById('start').addEventListener('click',function(){show(next)});
  document.getElementById('back').addEventListener('click',function(){show(welcome)});
  document.getElementById('login').addEventListener('click',function(){show(loginView)});
  document.getElementById('signup').addEventListener('click',function(){show(signupView)});
  [].forEach.call(document.querySelectorAll('[data-go="next"]'),function(b){b.addEventListener('click',function(){show(next)})});

  function errText(e){
    var m=((e&&(e.code||''))+' '+(e&&e.message||'')).toLowerCase();
    if(m.indexOf('invalid_credentials')>-1||m.indexOf('invalid login')>-1)return 'ئیمەیڵ یان وشەی نهێنی هەڵەیە.';
    if(m.indexOf('already')>-1)return 'ئەم ئیمەیڵە پێشتر تۆمارکراوە.';
    if(m.indexOf('weak_password')>-1||m.indexOf('password')>-1)return 'وشەی نهێنی لاوازە، بەهێزتر هەڵبژێرە.';
    if(m.indexOf('email_not_confirmed')>-1||m.indexOf('not confirmed')>-1)return 'سەرەتا ئیمەیڵەکەت پشتڕاست بکەرەوە.';
    if(m.indexOf('rate')>-1||m.indexOf('too many')>-1)return 'هەوڵی زۆرت دا، کەمێک چاوەڕێ بکە و دووبارە هەوڵ بدەوە.';
    if(m.indexOf('invalid')>-1&&m.indexOf('email')>-1)return 'ئیمەیڵەکە دروست نییە.';
    if(m.indexOf('fetch')>-1||m.indexOf('network')>-1)return 'پەیوەندی بە ئینتەرنێتەوە نییە.';
    return 'هەڵەیەک ڕوویدا، دووبارە هەوڵ بدەوە.';
  }
  function setMsg(el,t,ok){el.textContent=t||'';el.classList.toggle('ok',!!ok)}
  function busy(form,on){
    var b=form.querySelector('button[type=submit]');b.disabled=on;
    form.setAttribute('aria-busy',on?'true':'false');
  }
  function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}

  function showAccount(user){
    var name=(user.user_metadata&&user.user_metadata.display_name)||'';
    document.getElementById('hello').textContent=name?('سڵاو '+name):'سڵاو';
    document.getElementById('who').textContent=user.email||'';
    show(accountView);
    db.from('profiles').select('display_name').eq('id',user.id).maybeSingle().then(function(r){
      if(r&&r.data&&r.data.display_name)document.getElementById('hello').textContent='سڵاو '+r.data.display_name;
    });
  }

  var loginForm=document.getElementById('loginForm'),loginMsg=document.getElementById('loginMsg');
  loginForm.addEventListener('submit',function(e){
    e.preventDefault();
    if(!db){setMsg(loginMsg,'بارکردنی خزمەتگوزاری سەرکەوتوو نەبوو.');return}
    var email=loginForm.email.value.trim(),pw=loginForm.password.value;
    if(!validEmail(email)||!pw){setMsg(loginMsg,'ئیمەیڵ و وشەی نهێنی بنووسە.');return}
    setMsg(loginMsg,'');busy(loginForm,true);
    db.auth.signInWithPassword({email:email,password:pw}).then(function(r){
      busy(loginForm,false);
      if(r.error){
        var lm=((r.error.code||'')+' '+(r.error.message||'')).toLowerCase();
        if(lm.indexOf('email_not_confirmed')>-1||lm.indexOf('not confirmed')>-1){
          startVerify(email,true);return;
        }
        setMsg(loginMsg,errText(r.error));return;
      }
      loginForm.reset();showAccount(r.data.user);
    },function(err){busy(loginForm,false);setMsg(loginMsg,errText(err))});
  });

  var signupForm=document.getElementById('signupForm'),signupMsg=document.getElementById('signupMsg');
  signupForm.addEventListener('submit',function(e){
    e.preventDefault();
    if(!db){setMsg(signupMsg,'بارکردنی خزمەتگوزاری سەرکەوتوو نەبوو.');return}
    var name=signupForm.name.value.trim(),email=signupForm.email.value.trim(),pw=signupForm.password.value;
    if(name.length<2){setMsg(signupMsg,'ناوەکەت بنووسە.');return}
    if(!validEmail(email)){setMsg(signupMsg,'ئیمەیڵەکە دروست نییە.');return}
    if(pw.length<8){setMsg(signupMsg,'وشەی نهێنی لانیکەم ٨ پیت بێت.');return}
    setMsg(signupMsg,'');busy(signupForm,true);
    db.auth.signUp({email:email,password:pw,options:{data:{display_name:name}}}).then(function(r){
      busy(signupForm,false);
      if(r.error){setMsg(signupMsg,errText(r.error));return}
      var u=r.data.user;
      if(u&&u.identities&&u.identities.length===0){setMsg(signupMsg,'ئەم ئیمەیڵە پێشتر تۆمارکراوە.');return}
      signupForm.reset();
      if(r.data.session){showAccount(r.data.user)}
      else{startVerify(email,false)}
    },function(err){busy(signupForm,false);setMsg(signupMsg,errText(err))});
  });

  var verifyForm=document.getElementById('verifyForm'),verifyMsg=document.getElementById('verifyMsg');
  var resendBtn=document.getElementById('resend'),pendingEmail='',cool=null;
  function cooldown(sec){
    clearInterval(cool);resendBtn.disabled=true;
    function tick(){
      if(sec<=0){clearInterval(cool);resendBtn.disabled=false;resendBtn.textContent='ناردنەوەی کۆد';return}
      resendBtn.textContent='ناردنەوەی کۆد ('+sec+')';sec--;
    }
    tick();cool=setInterval(tick,1000);
  }
  function startVerify(email,resend){
    pendingEmail=email;
    document.getElementById('verifyEmail').textContent=email;
    verifyForm.reset();setMsg(verifyMsg,'');
    show(verifyView);
    cooldown(60);
    if(resend)sendCode(true);
    verifyForm.code.focus();
  }
  function sendCode(quiet){
    return db.auth.resend({type:'signup',email:pendingEmail}).then(function(r){
      if(r.error){setMsg(verifyMsg,errText(r.error));return}
      setMsg(verifyMsg,'کۆدێکی نوێمان نارد.',true);
    },function(err){setMsg(verifyMsg,errText(err))});
  }
  resendBtn.addEventListener('click',function(){
    if(!db||!pendingEmail)return;
    cooldown(60);sendCode();
  });
  document.getElementById('verifyBack').addEventListener('click',function(){show(signupView)});
  verifyForm.code.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'')});
  verifyForm.addEventListener('submit',function(e){
    e.preventDefault();
    if(!db){setMsg(verifyMsg,'بارکردنی خزمەتگوزاری سەرکەوتوو نەبوو.');return}
    var code=verifyForm.code.value.trim();
    if(code.length<6){setMsg(verifyMsg,'کۆدەکە بنووسە.');return}
    setMsg(verifyMsg,'');busy(verifyForm,true);
    db.auth.verifyOtp({email:pendingEmail,token:code,type:'signup'}).then(function(r){
      busy(verifyForm,false);
      if(r.error){
        var m=((r.error.code||'')+' '+(r.error.message||'')).toLowerCase();
        setMsg(verifyMsg,(m.indexOf('expired')>-1||m.indexOf('invalid')>-1)?'کۆدەکە هەڵەیە یان بەسەرچووە.':errText(r.error));
        return;
      }
      verifyForm.reset();
      if(r.data&&r.data.user)showAccount(r.data.user);else show(loginView);
    },function(err){busy(verifyForm,false);setMsg(verifyMsg,errText(err))});
  });

  document.getElementById('logout').addEventListener('click',function(){
    if(!db)return;
    db.auth.signOut().then(function(){show(welcome)});
  });

  if(db){
    db.auth.getSession().then(function(r){
      var ses=r&&r.data&&r.data.session;
      if(ses&&ses.user)showAccount(ses.user);
    });
  }
})();
</script>
</body>
</html>
