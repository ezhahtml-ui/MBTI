<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MBTI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Noto+Kufi+Arabic:wght@600;800&family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EFEBFF;--ink:#1E1B4B;--muted:#55527F;--tile:#FFFFFF;--line:rgba(30,27,75,.12);
  --c1:#E5456B;--c2:#0E9F93;--c3:#B9780A;--c4:#5B4AE6;--accent:#5B4AE6;--on-accent:#FFFFFF;
  --shadow:0 14px 32px -18px rgba(60,40,160,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--bg:#15133A;--ink:#F3F0FF;--muted:#B4B0DC;--tile:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
    --c1:#FF8A9B;--c2:#4FDCCB;--c3:#FFCB6B;--c4:#A99BFF;--accent:#A99BFF;--on-accent:#15133A;--shadow:0 14px 32px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#15133A;--ink:#F3F0FF;--muted:#B4B0DC;--tile:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --c1:#FF8A9B;--c2:#4FDCCB;--c3:#FFCB6B;--c4:#A99BFF;--accent:#A99BFF;--on-accent:#15133A;--shadow:0 14px 32px -18px rgba(0,0,0,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Noto Kufi Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{min-height:100vh;min-height:100dvh;padding:20px 20px 32px;max-width:44rem;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;direction:ltr}
.brand svg{width:28px;height:28px}
.brand b{font:800 1.1rem/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.04em}
.brand i{font:600 .8rem/1 "Vazirmatn",sans-serif;font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.35em .8em}
h1{margin:0;font:800 clamp(1.7rem,6vw,2.4rem)/1.3 "Noto Kufi Arabic","Vazirmatn",sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.85em 1.5em;border:0;border-radius:999px;cursor:pointer;background:var(--accent);color:var(--on-accent);font:800 1rem/1 "Noto Kufi Arabic","Vazirmatn",sans-serif;box-shadow:var(--shadow)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:.6em 1.1em;font-size:.9rem}
.btn:focus-visible,.field input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.login{margin:auto;width:100%;max-width:24rem;text-align:center}
.fields{display:flex;flex-direction:column;gap:14px;margin-top:1.6rem;text-align:start}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font:500 .95rem/1.4 "Vazirmatn",sans-serif;color:var(--muted)}
.field input{width:100%;padding:.95em 1.1em;border-radius:16px;border:2px solid var(--line);background:var(--tile);color:var(--ink);font:500 1rem/1.4 "Vazirmatn",system-ui,sans-serif;text-align:left}
.field input:focus{outline:none;border-color:var(--accent)}
.fields .btn{width:100%}
.msg{margin:0;min-height:1.4em;font:500 .92rem/1.6 "Vazirmatn",sans-serif;color:var(--c1);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1.4rem 0}
.stat{background:var(--tile);border:1px solid var(--line);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 1.9rem/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.stat span{font:500 .82rem/1.4 "Vazirmatn",sans-serif;color:var(--muted)}
.stat:nth-child(1) b{color:var(--c4)}.stat:nth-child(2) b{color:var(--c2)}.stat:nth-child(3) b{color:var(--c3)}
.search{width:100%;padding:.85em 1.1em;border-radius:16px;border:2px solid var(--line);background:var(--tile);color:var(--ink);font:500 1rem/1.4 "Vazirmatn",sans-serif}
.search:focus{outline:none;border-color:var(--accent)}
.list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:800 1.1rem/1 "Bricolage Grotesque","Noto Kufi Arabic",sans-serif;color:var(--on-accent);background:var(--accent)}
.row:nth-child(4n+1) .av{background:var(--c1)}.row:nth-child(4n+2) .av{background:var(--c2)}.row:nth-child(4n+3) .av{background:var(--c3)}
:root:not([data-theme="dark"]) .av{color:#fff}
.who{flex:1;min-width:0}
.who b{display:block;font:800 1rem/1.5 "Noto Kufi Arabic","Vazirmatn",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font:400 .82rem/1.5 "Vazirmatn",sans-serif;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{flex:none;text-align:end;font:500 .78rem/1.6 "Vazirmatn",sans-serif;color:var(--muted)}
.tag{display:inline-block;padding:.1em .7em;border-radius:999px;font-weight:500;color:var(--c2);border:1px solid var(--c2)}
.tag.no{color:var(--c3);border-color:var(--c3)}
.empty{text-align:center;color:var(--muted);padding:2rem 0;font:500 .95rem/1.7 "Vazirmatn",sans-serif}

.an{margin:0 0 2rem}
.an h2{margin:1.6rem 0 .6rem;font:800 1.25rem/1.4 "Noto Kufi Arabic","Vazirmatn",sans-serif}
.an .stats{grid-template-columns:repeat(3,1fr);margin:.6rem 0}
.an details{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin:8px 0}
.an summary{cursor:pointer;font:800 1rem/1.7 "Noto Kufi Arabic","Vazirmatn",sans-serif}
.an p,.an li{font:500 .9rem/1.8 "Vazirmatn",sans-serif;color:var(--muted);margin:.3rem 0}
.an ul{padding-inline-start:1.2rem;margin:.3rem 0}
.an .scroll{overflow-x:auto}
.an table{border-collapse:collapse;width:100%;font:500 .85rem/1.6 "Vazirmatn",sans-serif}
.an th,.an td{padding:.35em .6em;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.an td.w{white-space:normal;min-width:12em}
.an .warn{color:var(--c3)}
.an .ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.an bdi{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-width="5" stroke-linecap="round" transform="rotate(-90 20 20)">
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke="var(--c1)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-25" stroke="var(--c2)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-50" stroke="var(--c3)"/>
        <circle cx="20" cy="20" r="15" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="-75" stroke="var(--c4)"/></g></svg>
      <b>MBTI</b><i>Admin</i>
    </div>
    <button class="btn ghost" id="logout" type="button" hidden>چوونە دەرەوە</button>
  </header>

  <main style="flex:1;display:flex;flex-direction:column">
    <section class="login" id="loginView">
      <h1>داشبۆردی ئادمین</h1>
      <form class="fields" id="loginForm" novalidate>
        <label class="field"><span>ئیمەیڵ</span><input type="email" name="email" autocomplete="email" inputmode="email" required></label>
        <label class="field"><span>وشەی نهێنی</span><input type="password" name="password" autocomplete="current-password" required></label>
        <p class="msg" id="loginMsg" role="alert" aria-live="polite"></p>
        <button class="btn" type="submit">چوونە ژوورەوە</button>
      </form>
    </section>

    <section id="dash" hidden style="margin-top:1.6rem">
      <div class="an" id="an" aria-live="polite">
        <h1>ئامار</h1>
        <p id="anMsg"></p>
        <h2>گشتی</h2>
        <div class="stats" id="anOv"></div>
        <details open><summary>بانکی پرسیارەکان</summary><div id="anBank"></div></details>
        <details><summary>ئاماری ١٦ جۆر و دووتاییەکان</summary><div id="anTypes"></div></details>
        <details><summary>ئاماری وردەفاکتەرەکان (٢٠)</summary><div id="anFacets"></div></details>
        <details><summary>ئاماری ڕەفتارەکان (٤٠)</summary><div id="anContents"></div></details>
        <details><summary>Calibration</summary><div id="anCal"></div></details>
        <div class="ex">
          <button class="btn ghost" id="exJson" type="button" disabled>دەرکردن (JSON)</button>
          <button class="btn ghost" id="exCsv" type="button" disabled>دەرکردنی ڕەفتارەکان (CSV)</button>
        </div>
        <p>ئەم ئامارانە کۆکراوەن و ناسێنەری بەکارهێنەریان تێدا نییە.</p>
      </div>
      <h1>بەکارهێنەران</h1>
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>کۆی گشتی</span></div>
        <div class="stat"><b id="sWeek">0</b><span>نوێ لە ٧ ڕۆژدا</span></div>
        <div class="stat"><b id="sOk">0</b><span>پشتڕاستکراوە</span></div>
      </div>
      <input class="search" id="q" type="search" placeholder="گەڕان بە ناو یان ئیمەیڵ" aria-label="گەڕان">
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>هیچ بەکارهێنەرێک نەدۆزرایەوە.</p>
      <button class="btn ghost" id="refresh" type="button" style="margin:16px auto 0;display:flex">نوێکردنەوە</button>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var mem={};
  var store={
    getItem:function(k){try{var v=localStorage.getItem(k);if(v!==null)return v}catch(e){}
            try{var s=sessionStorage.getItem(k);if(s!==null)return s}catch(e){} return mem[k]||null},
    setItem:function(k,v){mem[k]=v;try{localStorage.setItem(k,v);return}catch(e){}
            try{sessionStorage.setItem(k,v)}catch(e){}},
    removeItem:function(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}
            try{sessionStorage.removeItem(k)}catch(e){}}
  };
  var db=window.supabase?window.supabase.createClient('https://rmalzfubkyrwubgoiwsq.supabase.co','sb_publishable_wTg5mh7u3nZ-dih6qtMuHQ_YIjB0WAw',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mbti-admin-auth',storage:store}}):null;
  var $=function(i){return document.getElementById(i)};
  var loginView=$('loginView'),dash=$('dash'),logoutBtn=$('logout'),users=[];

  function setView(isDash){
    loginView.hidden=isDash;dash.hidden=!isDash;logoutBtn.hidden=!isDash;
  }
  function render(){
    var q=$('q').value.trim().toLowerCase(),list=$('list');
    list.textContent='';
    var shown=users.filter(function(u){return !q||(u.display_name||'').toLowerCase().indexOf(q)>-1||(u.email||'').toLowerCase().indexOf(q)>-1});
    shown.forEach(function(u){
      var li=document.createElement('li');li.className='row';
      var av=document.createElement('div');av.className='av';av.textContent=((u.display_name||u.email||'?').trim().charAt(0)||'?').toUpperCase();
      var w=document.createElement('div');w.className='who';
      var b=document.createElement('b');b.textContent=u.display_name||'بێ ناو';
      var s=document.createElement('small');s.textContent=u.email||'';
      w.appendChild(b);w.appendChild(s);
      var m=document.createElement('div');m.className='meta';
      var t=document.createElement('span');t.className='tag'+(u.confirmed?'':' no');t.textContent=u.confirmed?'پشتڕاستکراوە':'چاوەڕێ';
      var d=document.createElement('div');d.textContent=new Date(u.created_at).toLocaleDateString('en-GB');
      m.appendChild(t);m.appendChild(d);
      li.appendChild(av);li.appendChild(w);li.appendChild(m);list.appendChild(li);
    });
    $('empty').hidden=shown.length>0;
  }
  function load(){
    return db.rpc('admin_list_users').then(function(r){
      if(r.error)return false;
      users=r.data||[];
      var wk=Date.now()-7*864e5;
      $('sTotal').textContent=users.length;
      $('sWeek').textContent=users.filter(function(u){return new Date(u.created_at).getTime()>wk}).length;
      $('sOk').textContent=users.filter(function(u){return u.confirmed}).length;
      render();setView(true);loadAnalytics();return true;
    });
  }

  /* ---------- Stage 8: aggregate statistics (no individual data) ---------- */
  var BANK=null,AN={ov:null,rs:null,cs:null};
  function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
  function clear(n){while(n.firstChild)n.removeChild(n.firstChild);return n}
  function fmt(n){return n==null?'—':new Intl.NumberFormat('en-US').format(n)}
  function para(host,txt,cls){host.appendChild(el('p',txt,cls))}
  function table(host,head,rows){
    var w=el('div',null,'scroll'),t=el('table'),tr=el('tr');
    head.forEach(function(h){tr.appendChild(el('th',h))});t.appendChild(tr);
    rows.forEach(function(r){var x=el('tr');r.forEach(function(c){x.appendChild(el('td',c==null?'—':String(c)))});t.appendChild(x)});
    w.appendChild(t);host.appendChild(w);
  }
  function loadBank(){
    if(BANK)return Promise.resolve(BANK);
    return fetch('question-bank.v1.json').then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(b){BANK=b;return b});
  }
  function count(arr,k){var o={};arr.forEach(function(x){var v=x[k];o[v]=(o[v]||0)+1});return o}
  function pairs(o){return Object.keys(o).sort().map(function(k){return k+': '+fmt(o[k])}).join(' · ')}
  function renderOverview(){
    var h=clear($('anOv')),o=AN.ov;
    if(!o){para($('anMsg'),'ئامارە کۆکراوەکان بەردەست نین (دەبێت فەنکشنەکانی ئامار لە داتابەیسدا دابنرێن).','warn');return}
    $('anMsg').textContent='';
    [['کۆی تێستەکان',o.sessions_total],['تەواوکراو',o.completed],['نیمچەچوو',o.in_progress],
     ['وازهێنراو',o.abandoned],['وەڵامەکان',o.responses_total],['ئەنجامەکان',o.results_total],
     ['ڕەزامەندی توێژینەوە',o.consent_research],['ڕەزامەندی کالیبرە',o.consent_calibration],['بەکارهێنەری تێستکەر',o.users_with_sessions]
    ].forEach(function(p){var d=el('div',null,'stat');d.appendChild(el('b',fmt(p[1])));d.appendChild(el('span',p[0]));h.appendChild(d)});
  }
  function renderBank(){
    var h=clear($('anBank')),b=BANK;
    if(!b){para(h,'بانکی پرسیارەکان بار نەبوو.','warn');return}
    var it=b.items||[],cl={};(b.contents||[]).forEach(function(c){cl[c.duplicate_cluster]=1});
    var hs=count(it,'text_hash'),dup=Object.keys(hs).filter(function(k){return hs[k]>1}).length;
    var ul=el('ul');
    [fmt(it.length)+' شێوازی نووسین بۆ '+fmt((b.contents||[]).length)+' ڕەفتار و '+fmt((b.facets||[]).length)+' فاکتەر (وەشان '+b.bank_version+')',
     'Review: '+pairs(count(it,'review_status')),'Active: '+pairs(count(it,'active_status')),
     'Calibration: '+pairs(count(it,'calibration_status')),
     'Difficulty دانراو: '+fmt(it.filter(function(x){return x.difficulty!=null}).length)+' · Discrimination دانراو: '+fmt(it.filter(function(x){return x.discrimination!=null}).length),
     'کلاستەری دووبارە: '+fmt(Object.keys(cl).length)+' · دەقی یەکسان (text_hash): '+fmt(dup)
    ].forEach(function(t){ul.appendChild(el('li',t))});h.appendChild(ul);
    (b.review_records||[]).forEach(function(r){
      var d=el('p',r.decision+' · '+r.scope+' · '+r.reviewer_role+' · '+r.date+' — '+r.basis);d.setAttribute('dir','ltr');h.appendChild(d)});
  }
  function renderTypes(){
    var h=clear($('anTypes')),r=AN.rs;
    if(!r){para(h,'بەردەست نییە.','warn');return}
    para(h,'ئەنجامی ڕەزامەندیدراو: '+fmt(r.consented_results));
    if(r.insufficient){para(h,'هێشتا داتای ڕەزامەندیدراو بەس نییە (کەمتر لە '+fmt(r.min_total)+' ئەنجام)، بۆیە دابەشکردنەکان نیشان نادرێن.','warn');return}
    var t=r.types||{};
    table(h,['جۆر','ژمارە'],Object.keys(t).sort().map(function(k){return [k,t[k]==null?'<'+r.min_cell:t[k]]}));
    var L=r.letters||{};para(h,'پیتەکان: '+Object.keys(L).sort().map(function(k){return k+' '+(L[k]==null?'<'+r.min_cell:fmt(L[k]))}).join(' · '));
    var C=r.confidence||{};para(h,'دڵنیایی: '+Object.keys(C).sort().map(function(k){return k+' '+(C[k]==null?'<'+r.min_cell:fmt(C[k]))}).join(' · '));
  }
  function renderFacets(){
    var h=clear($('anFacets')),r=AN.rs;
    para(h,(r&&r.results_with_facets>0)?('ئەنجامی خاوەن فاکتەر: '+fmt(r.results_with_facets)):'هێشتا نادیار: ئەنجامەکان وردەفاکتەریان تێدا نییە.');
  }
  function renderContents(){
    var h=clear($('anContents')),c=AN.cs;
    if(!c){para(h,'بەردەست نییە.','warn');return}
    var meta={};((BANK&&BANK.contents)||[]).forEach(function(x){meta[x.content_id]=x});
    para(h,'ئامارێکی وەسفییە، نەک کالیبرەکردن. دەرکەوتنی ئامار پێویستی بە لانیکەم '+fmt(c.min_n)+' وەڵام لە '+fmt(c.min_users)+' کەس هەیە.');
    if(!c.rows||!c.rows.length){para(h,'هێشتا هیچ داتایەکی کالیبرەکراو (بە ڕەزامەندی) نییە.');return}
    table(h,['ڕەفتار','ژمارەی وەڵام','کەس','تێکڕای ئاست','٢٠','٥٠','٧٥','١٠٠'],c.rows.map(function(x){
      var d=x.dist||{};return [x.content_id,fmt(x.n),fmt(x.users),x.mean_level==null?'نەگەیشتووە بە سنوور':x.mean_level,d['20'],d['50'],d['75'],d['100']]}));
  }
  function renderCal(){
    var h=clear($('anCal')),it=(BANK&&BANK.items)||[];
    var cal=it.filter(function(x){return x.calibration_status&&x.calibration_status!=='uncalibrated'}).length;
    para(h,'کالیبرەکراو: '+fmt(cal)+' لە '+fmt(it.length)+'. هیچ پارامەتەری IRT، Difficulty یان Discrimination بە فەرمی دانەنراوە.');
    para(h,'ئاگاداری: پرسیارەکان بە شێوەی Adaptive هەڵدەبژێردرێن، بۆیە وەڵامەکان نموونەی هەڕەمەکی نین و ئامارەکان بە تەنیا بۆ کالیبرەکردن بەس نین.');
  }
  function download(name,type,text){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  }
  function stamp(){return new Date().toISOString().slice(0,10)}
  function exportJson(){
    download('mbti-stats-'+stamp()+'.json','application/json',JSON.stringify({
      generated:stamp(),bank_version:BANK?BANK.bank_version:null,overview:AN.ov,research_summary:AN.rs,content_stats:AN.cs,
      note:'Aggregated, descriptive statistics only. No user identifiers. Not calibrated.'},null,2));
  }
  function exportCsv(){
    var rows=(AN.cs&&AN.cs.rows)||[],q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
    var out=['content_id,n,users,mean_level,lvl20,lvl50,lvl75,lvl100'].concat(rows.map(function(x){var d=x.dist||{};
      return [x.content_id,x.n,x.users,x.mean_level,d['20'],d['50'],d['75'],d['100']].map(q).join(',')}));
    download('mbti-content-stats-'+stamp()+'.csv','text/csv',out.join('\n'));
  }
  function rpcStat(n){return db.rpc(n).then(function(r){return r.error?null:r.data},function(){return null})}
  function loadAnalytics(){
    return Promise.all([rpcStat('admin_overview'),rpcStat('admin_research_summary'),rpcStat('admin_content_stats'),loadBank().catch(function(){return null})]).then(function(a){
      AN.ov=a[0];AN.rs=a[1];AN.cs=a[2];
      renderOverview();renderBank();renderTypes();renderFacets();renderContents();renderCal();
      $('exJson').disabled=!(AN.ov||AN.rs||AN.cs);$('exCsv').disabled=!(AN.cs&&AN.cs.rows&&AN.cs.rows.length);
    });
  }
  $('exJson').addEventListener('click',exportJson);$('exCsv').addEventListener('click',exportCsv);
  $('q').addEventListener('input',render);
  $('refresh').addEventListener('click',load);
  logoutBtn.addEventListener('click',function(){db.auth.signOut().then(function(){users=[];AN={ov:null,rs:null,cs:null};['anOv','anBank','anTypes','anFacets','anContents','anCal'].forEach(function(i){clear($(i))});setView(false)})});

  var f=$('loginForm'),msg=$('loginMsg');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!db){msg.textContent='بارکردنی خزمەتگوزاری سەرکەوتوو نەبوو.';return}
    var email=f.email.value.trim(),pw=f.password.value,btn=f.querySelector('button');
    if(!email||!pw){msg.textContent='ئیمەیڵ و وشەی نهێنی بنووسە.';return}
    msg.textContent='';btn.disabled=true;
    db.auth.signInWithPassword({email:email,password:pw}).then(function(r){
      if(r.error){btn.disabled=false;msg.textContent='ئیمەیڵ یان وشەی نهێنی هەڵەیە.';return}
      return load().then(function(ok){
        btn.disabled=false;
        if(ok){f.reset();return}
        db.auth.signOut();msg.textContent='ئەم هەژمارە ئادمین نییە.';
      });
    },function(){btn.disabled=false;msg.textContent='پەیوەندی بە ئینتەرنێتەوە نییە.'});
  });

  if(db)db.auth.getSession().then(function(r){if(r&&r.data&&r.data.session)load()});
})();
</script>
</body>
</html>
